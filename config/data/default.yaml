# Shared by train, eval and UI. No file lists or cached split manifests.
# Split each selected dataset independently, then combine matching partitions.
seed: 42
image_size: 256  # longest side after aspect-preserving resize; no crop/stretch
mask_sizes: [16, 32]

# Run download_data.py explicitly before training; download missing files only.
download:
  output_root: outputs/downloads
  timeout: 30
  retries: 3
  workers: 4
  user_agent: "COMP3057Proj/1.0 (educational dataset downloader)"

datasets:
  wikimedia:
    path: dataset/wikimedia
    source_url: https://commons.wikimedia.org/wiki/Category:Hong_Kong_skylines_(Hong_Kong_Island)
    download:
      provider: wikimedia
      api_url: https://commons.wikimedia.org/w/api.php
      category: "Category:Hong Kong skylines (Hong Kong Island)"
      thumbnail_width: 1280
      expected_count: 278
      manifest: outputs/downloads/manifests/wikimedia.json
    train_fraction: 0.70
    val_fraction: 0.15
    test_fraction: 0.15
